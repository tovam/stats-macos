name: weekly upstream sync

on:
  schedule:
    - cron: "17 6 * * 1"
      timezone: Europe/Podgorica
  workflow_dispatch:

concurrency:
  group: weekly-upstream-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.result.outputs.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Test upstream sync policy
        run: ruby Fork/tests/upstream_sync_test.rb

      - name: Merge upstream master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags https://github.com/exelban/stats.git master

          bash Fork/sync-upstream.sh FETCH_HEAD

      - name: Push merged master
        shell: bash
        run: |
          set -euo pipefail
          if push_output="$(git push origin HEAD:master 2>&1)"; then
            printf '%s\n' "$push_output"
          else
            printf '%s\n' "$push_output"
            # Surface Git's actual reason in the public annotations, not just
            # in the authenticated job log (permissions, rejected push, etc.).
            message="${push_output//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error title=Upstream push failed::$message"
            exit 1
          fi

      - name: Select revision to build
        id: result
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-and-release:
    needs: sync
    uses: ./.github/workflows/fork-build.yaml
    with:
      ref: ${{ needs.sync.outputs.sha }}
      publish_release: true
    permissions:
      contents: write
