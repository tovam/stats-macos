name: build

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4
      - name: Build application
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -scheme Stats \
            -destination 'platform=macOS' \
            -configuration Release \
            -derivedDataPath build \
            build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          grep -E 'error:|BUILD FAILED' xcodebuild.log | head -50 | while IFS= read -r line; do
            echo "::error::$line"
          done
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Xcode-build-log
          path: xcodebuild.log
          if-no-files-found: error
      - name: Package application
        run: >-
          ditto -c -k --keepParent
          build/Build/Products/Release/Stats.app
          build/Stats.app.zip
      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: Stats-macOS
          path: build/Stats.app.zip
          if-no-files-found: error
