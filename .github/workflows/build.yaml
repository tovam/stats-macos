name: build

on:
  workflow_call:
    inputs:
      ref:
        description: Commit or branch to build
        required: false
        type: string
        default: ""
      publish_release:
        description: Publish Stats.app.zip as a public GitHub Release
        required: false
        type: boolean
        default: false
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          persist-credentials: false
      - name: Build application
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -scheme Stats \
            -destination 'platform=macOS' \
            -configuration Release \
            -derivedDataPath build \
            build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          grep -E 'error:|BUILD FAILED' xcodebuild.log | head -50 | while IFS= read -r line; do
            echo "::error::$line"
          done
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Xcode-build-log
          path: xcodebuild.log
          if-no-files-found: error
      - name: Package application
        run: >-
          ditto -c -k --keepParent
          build/Build/Products/Release/Stats.app
          build/Stats.app.zip
      - name: Upload application
        uses: actions/upload-artifact@v7
        with:
          name: Stats-macOS
          path: build/Stats.app.zip
          if-no-files-found: error
      - name: Publish public release
        if: ${{ inputs.publish_release }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          release_date="$(date -u +%Y-%m-%d)"
          short_sha="${RELEASE_SHA:0:7}"
          tag="weekly-${release_date}-${short_sha}-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            "build/Stats.app.zip#Stats.app.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "Stats weekly build ${release_date}" \
            --notes "Automatic weekly build after merging exelban/stats. Fork commit: ${short_sha}." \
            --latest
